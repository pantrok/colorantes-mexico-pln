# Mapeo de la taxonomia de Open Food Facts a categorias analiticas del articulo.
#
# POR QUE HACE FALTA. La taxonomia de OFF es un grafo con herencia: un yogur de
# fresa lleva a la vez en:dairies, en:fermented-foods, en:fermented-milk-products,
# en:yogurts y en:flavoured-yogurts. Contar todas las etiquetas infla; contar solo
# la hoja fragmenta —hay cientos de hojas con n=1— y ademas la hoja mas frecuente
# del subconjunto mexicano es en:groceries (394), que significa "sin clasificar".
# Se necesita un mapeo declarado y auditable.
#
# COMO ASIGNA. Cada producto va a UNA sola categoria: la primera que coincida
# recorriendo `prioridad` en orden. El orden importa y es una decision, no un
# detalle: una galleta de chocolate cae en panificacion, no en confiteria.
#
# Las categorias estan pensadas para poder mapearse despues contra los grupos de
# gasto alimentario de la ENIGH. Ese cruce se documenta aparte.

meta:
  version: "0.1"
  fecha: "2026-08-23"
  nota: "Propuesta inicial. Revisar con la Dra. Granados-Balbuena antes de fijar."

# Se descartan del universo de analisis. El subconjunto trae productos no
# alimentarios: jabon liquido, cosmeticos, un medicamento (diclofenaco), slime.
excluir:
  - "en:non-food-products"
  - "en:cosmeticos"
  - "en:jabon-liquido-para-manos"
  - "en:slime"
  - "en:compuesto-b-diclofenaco"
  - "en:Nicotine"
  - "en:Bactericide"
  - "en:non-open-products-facts"

# Fuera del analisis principal pero se cuentan aparte: el acuerdo de COFEPRIS
# sobre eritrosina si los cubre, asi que conviene no perderlos de vista.
aparte:
  suplementos:
    - "en:dietary-supplements"
    - "en:vitamin-supplements"
    - "en:protein-powders"
    - "en:bodybuilding-supplements"
    - "en:collagen-protein"
    - "en:creatine"
  alcohol:
    - "en:alcoholic-beverages"
    - "en:beers"
    - "en:wines"
    - "en:liqueurs"
    - "en:tequilas"
    - "en:rums"
    - "en:mezcal"

# Orden de asignacion. Primera coincidencia gana.
prioridad:
  - confiteria
  - helados_y_paletas
  - botanas_saladas
  - panificacion_y_galleteria
  - cereales_desayuno
  - postres_y_gelatinas
  - lacteos
  - bebidas_no_alcoholicas
  - carnicos_procesados
  - salsas_y_aderezos
  - conservas_y_untables
  - comidas_preparadas

categorias:
