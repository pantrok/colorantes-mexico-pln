meta:
  fuente: Acuerdo por el que se determinan los aditivos y coadyuvantes en alimentos, bebidas y suplementos
    alimenticios. DOF 16/07/2012, Anexos III y IV. Mas listas incrementales de COFEPRIS 2015-2026 (Anexos
    III y IV de aditivos no publicados en el DOF).
  extraido: '2026-08-27'
  nota: 'Nomenclatura OFICIAL. El articulo DECIMOSEGUNDO del Acuerdo obliga a declarar cada aditivo por
    su nombre comun o por alguno de estos sinonimos. No es una lista nuestra: es la que la ley reconoce
    como declaracion valida en etiqueta.'
  advertencia: El Acuerdo asigna CI 42900 al azul brillante FCF; el Colour Index internacional es 42090.
    La transposicion aparece en las tres ocurrencias del documento oficial. Una etiqueta que siga la norma
    mexicana escribiria 42900.
